# Docker Compose automatically loads a .env file in the same directory.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    restart: unless-stopped
    depends_on:
      - db
      - flyway

  frontend:
    build:
      context: ./parcezza-frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-parcezza}
      - POSTGRES_USER=${POSTGRES_USER:-parcezza}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-parcezza}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parcezza}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:7
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@local}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - db

  flyway:
    image: flyway/flyway:9
    command: -url=jdbc:postgresql://db:5432/${POSTGRES_DB:-parcezza} -user=${POSTGRES_USER:-parcezza} -password=${POSTGRES_PASSWORD:-parcezza} -locations=filesystem:/flyway/sql migrate
    volumes:
      - ./backend/src/main/resources/db/migration:/flyway/sql
    depends_on:
      - db
    environment:
      - FLYWAY_PLACEHOLDERS_DB=${POSTGRES_DB}
    restart: "no"

volumes:
  db-data:

