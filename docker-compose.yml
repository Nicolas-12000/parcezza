version: '3.8'

services:
  backend:
    image: app-backend:latest
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    restart: unless-stopped
    depends_on:
      - db

  frontend:
    image: app-frontend:latest
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-parcezza}
      - POSTGRES_USER=${POSTGRES_USER:-parcezza}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-parcezza}
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:

