<div class="auth-container">
  <div class="card auth-card">
    <h2 style="margin-bottom: var(--space-md); text-align: center;">Welcome Back</h2>
    <p style="text-align: center; color: var(--color-secondary); margin-bottom: var(--space-lg);">
      Please enter your details to sign in.
    </p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          placeholder="Enter your email"
          [ngClass]="{ 'is-invalid': submitted && f['email'].errors }"
        >
        <div *ngIf="submitted && f['email'].errors" class="error-message">
          <span *ngIf="f['email'].errors['required']">Email is required</span>
          <span *ngIf="f['email'].errors['email']">Must be a valid email address</span>
          <span *ngIf="f['email'].errors['maxlength']">Email is too long</span>
          <span *ngIf="f['email'].errors['hasHtmlTags']">Invalid characters detected</span>
          <span *ngIf="f['email'].errors['whitespaceAround']">Cannot contain leading/trailing spaces</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          formControlName="password" 
          placeholder="••••••••"
          [ngClass]="{ 'is-invalid': submitted && f['password'].errors }"
        >
        <div *ngIf="submitted && f['password'].errors" class="error-message">
          <span *ngIf="f['password'].errors['required']">Password is required</span>
          <span *ngIf="f['password'].errors['minlength']">Password must be at least 8 characters</span>
          <span *ngIf="f['password'].errors['hasHtmlTags']">Invalid characters detected</span>
        </div>
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; margin-top: var(--space-md);">Sign In</button>
    </form>
  </div>
</div>
